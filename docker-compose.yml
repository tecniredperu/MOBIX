services:
  postgres:
    image: postgres:16-alpine
    container_name: mobix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobix
      POSTGRES_PASSWORD: mobix
      POSTGRES_DB: mobix
    ports:
      - "5433:5432"
    volumes:
      - mobix_postgres_data:/var/lib/postgresql/data

volumes:
  mobix_postgres_data:
