name: MOBIX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mobix
          POSTGRES_PASSWORD: mobix
          POSTGRES_DB: mobix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobix -d mobix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mobix:mobix@localhost:5432/mobix?schema=public
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restaurar caché de Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Generar credenciales efímeras de CI
        run: |
          node -e "const c=require('crypto'); console.log('AUTH_SECRET='+c.randomBytes(48).toString('hex')); console.log('MOBIX_BOOTSTRAP_PASSWORD='+c.randomBytes(24).toString('base64url'))" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias de producción
        run: node scripts/audit-production.mjs

      - name: Generar cliente Prisma
        run: npm run db:generate

      - name: Validar Prisma
        run: npm run db:validate

      - name: Aplicar migraciones desde cero
        run: npx prisma migrate deploy

      - name: Cargar datos de prueba
        run: npm run db:seed

      - name: Pruebas unitarias de negocio
        run: npm run test:unit

      - name: Pruebas de integración y concurrencia
        run: npm run test:integration

      - name: Revisar TypeScript
        run: npm run typecheck

      - name: Compilar Next.js para producción
        run: npm run build

      - name: Iniciar MOBIX en modo producción
        run: |
          npm run start -- -p 3001 > /tmp/mobix-next.log 2>&1 &
          echo $! > /tmp/mobix-next.pid

      - name: Esperar servidor y base de datos
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mobix-next.log || true
          exit 1

      - name: Crear sesión de smoke test
        run: |
          SESSION_TOKEN=$(node scripts/create-ci-session.mjs)
          echo "MOBIX_SESSION_TOKEN=$SESSION_TOKEN" >> "$GITHUB_ENV"

      - name: Probar venta POS real por API
        run: |
          set -euo pipefail

          npx tsx scripts/ci-pos-sale-e2e.ts prepare /tmp/mobix-pos-sale-fixture.json >/tmp/mobix-pos-sale-fixture-stdout.json

          WAREHOUSE_ID=$(node -e 'const x=require("fs").readFileSync("/tmp/mobix-pos-sale-fixture.json","utf8"); process.stdout.write(JSON.parse(x).warehouseId)')
          VARIANT_ID=$(node -e 'const x=require("fs").readFileSync("/tmp/mobix-pos-sale-fixture.json","utf8"); process.stdout.write(JSON.parse(x).variantId)')
          UNIT_PRICE=$(node -e 'const x=require("fs").readFileSync("/tmp/mobix-pos-sale-fixture.json","utf8"); process.stdout.write(String(JSON.parse(x).unitPrice))')
          TENDERED=$(node -e 'const x=require("fs").readFileSync("/tmp/mobix-pos-sale-fixture.json","utf8"); process.stdout.write(String(JSON.parse(x).tendered))')

          CASH_STATUS=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            http://127.0.0.1:3001/api/pos/cash-status)
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.requireCashSession || !x.open) { console.error(x); process.exit(1); }' "$CASH_STATUS"

          SALE_PAYLOAD=$(node -e '
            const [warehouseId, variantId, unitPrice, tendered] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              warehouseId,
              documentType: "RECEIPT",
              taxCondition: "TAXED",
              discount: 0,
              lines: [{ variantId, quantity: 1, unitPrice: Number(unitPrice) }],
              payments: [{ method: "CASH", amount: Number(tendered) }]
            }));
          ' "$WAREHOUSE_ID" "$VARIANT_ID" "$UNIT_PRICE" "$TENDERED")

          curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "$SALE_PAYLOAD" \
            http://127.0.0.1:3001/api/pos/sales \
            > /tmp/mobix-pos-sale-response.json

          npx tsx scripts/ci-pos-sale-e2e.ts verify \
            /tmp/mobix-pos-sale-fixture.json \
            /tmp/mobix-pos-sale-response.json

      - name: Validar comprobantes de la venta real
        run: |
          set -euo pipefail

          SALE_ID=$(node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/mobix-pos-sale-response.json","utf8")); if(!x.sale?.id) process.exit(1); process.stdout.write(x.sale.id)')

          DETAIL_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/ventas/${SALE_ID}?created=1")
          echo "$DETAIL_HTML" | grep -q "sale-receipt-a4"
          echo "$DETAIL_HTML" | grep -q "receipt-document-box"
          echo "$DETAIL_HTML" | grep -q "receipt-a4-table"
          echo "$DETAIL_HTML" | grep -q "Forma de pago"

          TICKET_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/ventas/${SALE_ID}/ticket")
          echo "$TICKET_HTML" | grep -q "ticket-page"
          echo "$TICKET_HTML" | grep -q "BOLETA DE VENTA"
          echo "$TICKET_HTML" | grep -q "Efectivo"

          COMBINED=$(printf "%s\n%s" "$DETAIL_HTML" "$TICKET_HTML" | tr '[:upper:]' '[:lower:]')
          if echo "$COMBINED" | grep -q "facturación electrónica se implementará más adelante"; then
            echo "El comprobante contiene un aviso de facturación electrónica pendiente."
            exit 1
          fi

      - name: Verificar protección de acceso
        run: |
          curl -fsS http://127.0.0.1:3001/login >/dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/productos)
          if [ "$STATUS" != "307" ] && [ "$STATUS" != "308" ]; then
            echo "Se esperaba redirección a login y se recibió HTTP $STATUS"
            exit 1
          fi

      - name: Smoke test de rutas críticas autenticadas
        run: |
          set -e
          routes=(
            "/"
            "/productos"
            "/productos/nuevo"
            "/productos/categorias"
            "/productos/marcas"
            "/equipos"
            "/kardex"
            "/compras"
            "/compras/nueva"
            "/proveedores"
            "/pos"
            "/ventas"
            "/clientes"
            "/servicio-tecnico"
            "/caja"
            "/reportes"
            "/devoluciones"
            "/transferencias"
            "/administracion/usuarios"
            "/administracion/roles"
            "/configuracion"
            "/cuenta"
            "/buscar?q=iPhone"
          )
          for route in "${routes[@]}"; do
            echo "Probando $route"
            curl -fsS -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" "http://127.0.0.1:3001${route}" >/dev/null || {
              echo "Fallo en $route"
              cat /tmp/mobix-next.log || true
              exit 1
            }
          done

      - name: Probar alta completa de catálogo y producto
        run: |
          set -euo pipefail

          CATEGORY_RESPONSE=$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data '{"kind":"category","name":"CI Cases"}' \
            http://127.0.0.1:3001/api/catalog/options)
          CATEGORY_ID=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.option?.id) process.exit(1); process.stdout.write(x.option.id)' "$CATEGORY_RESPONSE")

          BRAND_RESPONSE=$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data '{"kind":"brand","name":"CI Caseify"}' \
            http://127.0.0.1:3001/api/catalog/options)
          BRAND_ID=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.option?.id) process.exit(1); process.stdout.write(x.option.id)' "$BRAND_RESPONSE")

          PRODUCT_PAYLOAD=$(cat <<JSON
          {"type":"ACCESSORY","categoryId":"${CATEGORY_ID}","brandId":"${BRAND_ID}","name":"CI CASE IPHONE 17 PRO MAX SILICONA","model":"CI-CASE-17PM","sku":"CI-CASE-17PM","barcode":"CI170001","description":"Producto creado por prueba E2E de MOBIX","warrantyDays":"30","minimumStock":"2","variants":[{"sku":"CI-CASE-17PM-BLK","barcode":"CI170001-BLK","color":"Negro","ram":"","storage":"","purchasePrice":15.5,"salePrice":29.9,"minimumSalePrice":24.9}]}
          JSON
          )

          PRODUCT_RESPONSE=$(curl -fsS \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "$PRODUCT_PAYLOAD" \
            http://127.0.0.1:3001/api/products)
          PRODUCT_ID=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.product?.id) process.exit(1); process.stdout.write(x.product.id)' "$PRODUCT_RESPONSE")
          VARIANT_ID=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.product?.variants?.[0]?.id) process.exit(1); process.stdout.write(x.product.variants[0].id)' "$PRODUCT_RESPONSE")
          test -n "$PRODUCT_ID"
          test -n "$VARIANT_ID"

          PRODUCTS_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/productos?created=1")
          echo "$PRODUCTS_HTML" | grep -q "CI CASE IPHONE 17 PRO MAX SILICONA"
          echo "$PRODUCTS_HTML" | grep -q "Producto guardado"
          echo "$PRODUCTS_HTML" | grep -q "CI Caseify"

          EDIT_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/productos/${PRODUCT_ID}/editar")
          echo "$EDIT_HTML" | grep -q "Editar producto"
          echo "$EDIT_HTML" | grep -q "CI CASE IPHONE 17 PRO MAX SILICONA"

          IMAGE_DATA="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2n0AAAAASUVORK5CYII="
          UPDATE_PAYLOAD=$(cat <<JSON
          {"action":"update","categoryId":"${CATEGORY_ID}","brandId":"${BRAND_ID}","name":"CI CASE IPHONE 17 PRO MAX SILICONA EDITADO","model":"CI-CASE-17PM-V2","sku":"CI-CASE-17PM","barcode":"CI170001","description":"Producto editado por CI","warrantyDays":45,"minimumStock":3,"imageData":"${IMAGE_DATA}","imageMimeType":"image/png","removeImage":false,"variants":[{"id":"${VARIANT_ID}","sku":"CI-CASE-17PM-BLK","barcode":"CI170001-BLK","color":"Negro","ram":"","storage":"","purchasePrice":16.5,"salePrice":31.9,"minimumSalePrice":25.9}]}
          JSON
          )

          UPDATE_RESPONSE=$(curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "$UPDATE_PAYLOAD" \
            "http://127.0.0.1:3001/api/products/${PRODUCT_ID}")
          echo "$UPDATE_RESPONSE" | grep -q "CI CASE IPHONE 17 PRO MAX SILICONA EDITADO"

          UPDATED_PRODUCTS_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/productos?updated=1")
          echo "$UPDATED_PRODUCTS_HTML" | grep -q "CI CASE IPHONE 17 PRO MAX SILICONA EDITADO"
          echo "$UPDATED_PRODUCTS_HTML" | grep -q "Producto actualizado"

          echo "$UPDATED_PRODUCTS_HTML" | grep -q "/api/products/${PRODUCT_ID}/image?v="

          IMAGE_STATUS=$(curl -s \
            -o /tmp/mobix-product-image.bin \
            -D /tmp/mobix-product-image.headers \
            -w "%{http_code}" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/api/products/${PRODUCT_ID}/image")
          if [ "$IMAGE_STATUS" != "200" ]; then
            echo "Se esperaba HTTP 200 al leer la imagen y se recibió $IMAGE_STATUS"
            exit 1
          fi
          grep -qi "content-type: image/png" /tmp/mobix-product-image.headers

          DISABLE_PRODUCT=$(curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data '{"action":"status","status":"INACTIVE"}' \
            "http://127.0.0.1:3001/api/products/${PRODUCT_ID}")
          echo "$DISABLE_PRODUCT" | grep -q '"status":"INACTIVE"'

          WAREHOUSE_ID=$(node -e 'const x=require("fs").readFileSync("/tmp/mobix-pos-sale-fixture.json","utf8"); process.stdout.write(JSON.parse(x).warehouseId)')

          INACTIVE_CATALOG=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/api/pos/catalog?q=CI-CASE-17PM-BLK&warehouseId=${WAREHOUSE_ID}")
          node -e '
            const body=JSON.parse(process.argv[1]);
            const variantId=process.argv[2];
            if ((body.items || []).some((item) => item.variantId === variantId)) {
              console.error("El producto inactivo sigue apareciendo en el POS.");
              process.exit(1);
            }
          ' "$INACTIVE_CATALOG" "$VARIANT_ID"

          STALE_POS_PAYLOAD=$(cat <<JSON
          {"warehouseId":"${WAREHOUSE_ID}","documentType":"RECEIPT","taxCondition":"TAXED","discount":0,"lines":[{"variantId":"${VARIANT_ID}","quantity":1,"unitPrice":31.9}],"payments":[{"method":"CASH","amount":31.9}]}
          JSON
          )
          INACTIVE_SALE_STATUS=$(curl -s \
            -o /tmp/mobix-inactive-product-sale.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "$STALE_POS_PAYLOAD" \
            http://127.0.0.1:3001/api/pos/sales)
          if [ "$INACTIVE_SALE_STATUS" != "400" ]; then
            echo "Un POS con datos antiguos pudo vender un producto inactivo. HTTP $INACTIVE_SALE_STATUS"
            cat /tmp/mobix-inactive-product-sale.json || true
            exit 1
          fi
          grep -q "ya no están disponibles" /tmp/mobix-inactive-product-sale.json

          ENABLE_PRODUCT=$(curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data '{"action":"status","status":"ACTIVE"}' \
            "http://127.0.0.1:3001/api/products/${PRODUCT_ID}")
          echo "$ENABLE_PRODUCT" | grep -q '"status":"ACTIVE"'

          ACTIVE_CATALOG=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/api/pos/catalog?q=CI-CASE-17PM-BLK&warehouseId=${WAREHOUSE_ID}")
          node -e '
            const body=JSON.parse(process.argv[1]);
            const variantId=process.argv[2];
            if (!(body.items || []).some((item) => item.variantId === variantId)) {
              console.error("El producto reactivado no volvió al POS.");
              process.exit(1);
            }
          ' "$ACTIVE_CATALOG" "$VARIANT_ID"

          CATEGORY_PATCH=$(curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "{\"kind\":\"category\",\"id\":\"${CATEGORY_ID}\",\"name\":\"CI Cases Editadas\"}" \
            http://127.0.0.1:3001/api/catalog/options)
          echo "$CATEGORY_PATCH" | grep -q "CI Cases Editadas"

          BRAND_DISABLE=$(curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "{\"kind\":\"brand\",\"id\":\"${BRAND_ID}\",\"status\":\"INACTIVE\"}" \
            http://127.0.0.1:3001/api/catalog/options)
          echo "$BRAND_DISABLE" | grep -q '"status":"INACTIVE"'

          BRAND_ENABLE=$(curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "{\"kind\":\"brand\",\"id\":\"${BRAND_ID}\",\"status\":\"ACTIVE\"}" \
            http://127.0.0.1:3001/api/catalog/options)
          echo "$BRAND_ENABLE" | grep -q '"status":"ACTIVE"'

          CATEGORIES_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            http://127.0.0.1:3001/productos/categorias)
          echo "$CATEGORIES_HTML" | grep -q "CI Cases Editadas"

          BRANDS_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            http://127.0.0.1:3001/productos/marcas)
          echo "$BRANDS_HTML" | grep -q "CI Caseify"

          DUPLICATE_STATUS=$(curl -s \
            -o /tmp/mobix-duplicate-product.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "$PRODUCT_PAYLOAD" \
            http://127.0.0.1:3001/api/products)
          if [ "$DUPLICATE_STATUS" != "409" ]; then
            echo "Se esperaba HTTP 409 para SKU duplicado y se recibió $DUPLICATE_STATUS"
            cat /tmp/mobix-duplicate-product.json || true
            exit 1
          fi

          INVALID_STATUS=$(curl -s \
            -o /tmp/mobix-invalid-product.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data '{"type":"ACCESSORY","name":"X","warrantyDays":"0","minimumStock":"0","variants":[]}' \
            http://127.0.0.1:3001/api/products)
          if [ "$INVALID_STATUS" != "400" ]; then
            echo "Se esperaba HTTP 400 para producto inválido y se recibió $INVALID_STATUS"
            cat /tmp/mobix-invalid-product.json || true
            exit 1
          fi

          DELETE_RESPONSE=$(curl -fsS \
            -X DELETE \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/api/products/${PRODUCT_ID}")
          echo "$DELETE_RESPONSE" | grep -q '"deleted":true'

          AFTER_DELETE_HTML=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            http://127.0.0.1:3001/productos)
          if echo "$AFTER_DELETE_HTML" | grep -q "CI CASE IPHONE 17 PRO MAX SILICONA EDITADO"; then
            echo "El producto eliminado lógicamente sigue apareciendo en la lista."
            exit 1
          fi

          DELETED_CATALOG=$(curl -fsS \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            "http://127.0.0.1:3001/api/pos/catalog?q=CI-CASE-17PM-BLK&warehouseId=${WAREHOUSE_ID}")
          node -e '
            const body=JSON.parse(process.argv[1]);
            const variantId=process.argv[2];
            if ((body.items || []).some((item) => item.variantId === variantId)) {
              console.error("El producto eliminado sigue apareciendo en el POS.");
              process.exit(1);
            }
          ' "$DELETED_CATALOG" "$VARIANT_ID"

          DELETED_SALE_STATUS=$(curl -s \
            -o /tmp/mobix-deleted-product-sale.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Cookie: mobix_session=${MOBIX_SESSION_TOKEN}" \
            --data "$STALE_POS_PAYLOAD" \
            http://127.0.0.1:3001/api/pos/sales)
          if [ "$DELETED_SALE_STATUS" != "400" ]; then
            echo "Un POS con datos antiguos pudo vender un producto eliminado. HTTP $DELETED_SALE_STATUS"
            cat /tmp/mobix-deleted-product-sale.json || true
            exit 1
          fi
          grep -q "ya no están disponibles" /tmp/mobix-deleted-product-sale.json

      - name: Construir imagen Docker de producción
        run: docker build -t mobix-ci:${{ github.sha }} .

      - name: Mostrar log si falla
        if: failure()
        run: cat /tmp/mobix-next.log || true
