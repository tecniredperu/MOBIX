services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
    volumes:
      - mobix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mobix_backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET}
      HEALTH_DETAILS_TOKEN: ${HEALTH_DETAILS_TOKEN:?Define HEALTH_DETAILS_TOKEN}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    ports:
      - "127.0.0.1:${MOBIX_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - mobix_backend

volumes:
  mobix_postgres_data:

networks:
  mobix_backend:
    driver: bridge
